networks:
  default:
    name: penpot_shared
    external: true

volumes:
  user_data:
    name: ${PENPOT_USER_DATA_VOLUME}

services:
  main:
    privileged: true
    image: "penpotapp/devenv:${DEVENV_TAG:-latest}"
    build:
      context: "."
    container_name: "${PENPOT_MAIN_CONTAINER_NAME}"
    stop_signal: SIGINT

    volumes:
      - "user_data:/home/penpot/"
      - "${PENPOT_SOURCE_PATH}:/home/penpot/penpot:z"
      # Penforge: per-machine TLS cert for https://localhost:3449 signed by a
      # localhost-only local CA (see wiki runbook). Generated, never committed.
      - "./files/local-tls/localhost-fullchain.crt:/home/selfsigned.crt:ro"
      - "./files/local-tls/localhost.key:/home/selfsigned.key:ro"
      # Penforge: heavy build folders live on the Linux side (WSL ext4 on
      # Windows) instead of the slow host file-sharing bridge. Created by
      # scripts/penforge-devenv-cache, which manage.sh run-devenv calls.
      - "${HOME}/.penforge-devenv/ws0/pnpm-store:/home/penpot/penpot/.pnpm-store"
      - "${HOME}/.penforge-devenv/ws0/frontend-node_modules:/home/penpot/penpot/frontend/node_modules"
      - "${HOME}/.penforge-devenv/ws0/frontend-draft-js-node_modules:/home/penpot/penpot/frontend/packages/draft-js/node_modules"
      - "${HOME}/.penforge-devenv/ws0/frontend-ui-node_modules:/home/penpot/penpot/frontend/packages/ui/node_modules"
      - "${HOME}/.penforge-devenv/ws0/frontend-text-editor-node_modules:/home/penpot/penpot/frontend/text-editor/node_modules"
      - "${HOME}/.penforge-devenv/ws0/frontend-shadow-cljs:/home/penpot/penpot/frontend/.shadow-cljs"
      - "${HOME}/.penforge-devenv/ws0/frontend-target:/home/penpot/penpot/frontend/target"
      - "${HOME}/.penforge-devenv/ws0/frontend-cpcache:/home/penpot/penpot/frontend/.cpcache"
      - "${HOME}/.penforge-devenv/ws0/frontend-js-cljs-runtime:/home/penpot/penpot/frontend/resources/public/js/cljs-runtime"
      - "${HOME}/.penforge-devenv/ws0/frontend-js-worker-cljs-runtime:/home/penpot/penpot/frontend/resources/public/js/worker/cljs-runtime"
      - "${HOME}/.penforge-devenv/ws0/exporter-node_modules:/home/penpot/penpot/exporter/node_modules"
      - "${HOME}/.penforge-devenv/ws0/exporter-target:/home/penpot/penpot/exporter/target"
      - "${HOME}/.penforge-devenv/ws0/exporter-cpcache:/home/penpot/penpot/exporter/.cpcache"
      - "${HOME}/.penforge-devenv/ws0/plugins-node_modules:/home/penpot/penpot/plugins/node_modules"
      - "${HOME}/.penforge-devenv/ws0/plugins-runtime-node_modules:/home/penpot/penpot/plugins/libs/plugins-runtime/node_modules"
      - "${HOME}/.penforge-devenv/ws0/plugins-composable-test-suite-node_modules:/home/penpot/penpot/plugins/apps/composable-test-suite/node_modules"
      - "${HOME}/.penforge-devenv/ws0/plugins-plugin-api-test-suite-node_modules:/home/penpot/penpot/plugins/apps/plugin-api-test-suite/node_modules"
      - "${HOME}/.penforge-devenv/ws0/render-wasm-node_modules:/home/penpot/penpot/render-wasm/node_modules"
      - "${HOME}/.penforge-devenv/ws0/render-wasm-target:/home/penpot/penpot/render-wasm/target"
      - "${HOME}/.penforge-devenv/ws0/backend-cpcache:/home/penpot/penpot/backend/.cpcache"

    ports:
      # Host ports are instance-specific; container ports stay fixed.
      - ${PENPOT_PUBLIC_HTTPS_PORT}:3449
      - ${PENPOT_PUBLIC_HTTPS_PORT}:3449/udp
      - ${PENPOT_PUBLIC_HTTP_PORT}:3450
      - ${PENPOT_PUBLIC_HTTP_PORT}:3450/udp

      # Storybook
      - ${PENPOT_STORYBOOK_PORT}:3451

      # MCP
      - ${PENPOT_MCP_SERVER_PORT}:4401
      - ${PENPOT_MCP_REPL_PORT}:4403

      # Serena MCP server (agentic mode only). Internal ports fixed by Serena.
      - ${SERENA_EXTERNAL_PORT}:14281
      - ${SERENA_DASHBOARD_EXTERNAL_PORT}:24282

      # OpenCode Server
      - ${OPENCODE_EXTERNAL_PORT}:14180

      # MDTS (Markdown Visualizer)
      - ${MDTS_EXTERNAL_PORT}:14179

    environment:
      - EXTERNAL_UID=${CURRENT_USER_ID}
      - COLORTERM=truecolor
      - TERM=xterm-256color

      # Penforge: no Nitrate admin console locally (otherwise get-profile
      # fails with nitrate-unavailable); enable the Penforge AI features.
      # enable-mcp stays off: the MCP server runs on the host daemon.
      - PENPOT_FLAGS=disable-admin-console enable-ai

      # SMTP setup (shared infra service; identical across instances)
      - PENPOT_SMTP_ENABLED=true
      - PENPOT_SMTP_DEFAULT_FROM=no-reply@example.com
      - PENPOT_SMTP_DEFAULT_REPLY_TO=no-reply@example.com
      - PENPOT_SMTP_HOST=mailer
      - PENPOT_SMTP_PORT=1025
      - PENPOT_SMTP_USERNAME=
      - PENPOT_SMTP_PASSWORD=
      - PENPOT_SMTP_SSL=false
      - PENPOT_SMTP_TLS=false

      # LDAP setup (shared infra service; identical across instances)
      - PENPOT_LDAP_HOST=ldap
      - PENPOT_LDAP_PORT=10389
      - PENPOT_LDAP_SSL=false
      - PENPOT_LDAP_STARTTLS=false
      - PENPOT_LDAP_BASE_DN=ou=people,dc=planetexpress,dc=com
      - PENPOT_LDAP_BIND_DN=cn=admin,dc=planetexpress,dc=com
      - PENPOT_LDAP_BIND_PASSWORD=GoodNewsEveryone
      - PENPOT_LDAP_ATTRS_USERNAME=uid
      - PENPOT_LDAP_ATTRS_EMAIL=mail
      - PENPOT_LDAP_ATTRS_FULLNAME=cn
      - PENPOT_LDAP_ATTRS_PHOTO=jpegPhoto

      # Per-instance runtime config. Defaults live in defaults.env.
      - PENPOT_HOST=${PENPOT_HOST}
      - PENPOT_PUBLIC_URI=${PENPOT_PUBLIC_URI}
      - PENPOT_DATABASE_URI=${PENPOT_DATABASE_URI}
      - PENPOT_DATABASE_USERNAME=${PENPOT_DATABASE_USERNAME}
      - PENPOT_DATABASE_PASSWORD=${PENPOT_DATABASE_PASSWORD}
      - PENPOT_DATABASE_MAX_POOL_SIZE=${PENPOT_DATABASE_MAX_POOL_SIZE}
      - PENPOT_REDIS_URI=${PENPOT_REDIS_URI}
      # Per-instance backend-test config. Values come from
      # instance-env-overrides in manage.sh; the main database above stays
      # shared by all instances on purpose.
      - PENPOT_TEST_DATABASE_URI=${PENPOT_TEST_DATABASE_URI}
      - PENPOT_TEST_REDIS_URI=${PENPOT_TEST_REDIS_URI}
      - PENPOT_OBJECTS_STORAGE_BACKEND=${PENPOT_OBJECTS_STORAGE_BACKEND}
      - PENPOT_OBJECTS_STORAGE_S3_ENDPOINT=${PENPOT_OBJECTS_STORAGE_S3_ENDPOINT}
      - PENPOT_OBJECTS_STORAGE_S3_BUCKET=${PENPOT_OBJECTS_STORAGE_S3_BUCKET}
      - PENPOT_OBJECTS_STORAGE_S3_REGION=${PENPOT_OBJECTS_STORAGE_S3_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - PENPOT_TENANT=${PENPOT_TENANT}
      - PENPOT_TMUX_ATTACH=${PENPOT_TMUX_ATTACH}

      # Agentic devenv: set to a PyPI release version/tag to update Serena on startup,
      # leave empty to skip update and use the version baked into the image.
      - SERENA_UPDATE_VERSION=2.1.0
      - SHADOW_SERVER_URL=${SHADOW_SERVER_URL}

      # Frontend dev devenv switch: makes the frontend compile with
      # PENPOT_DEVENV=true so the admin-console is disabled by default
      # (app.config/devenv-mode). `enable-admin-console` in config.js
      # re-enables it.
      - PENPOT_DEVENV=true

    networks:
      - default
