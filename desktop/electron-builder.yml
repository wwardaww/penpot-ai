# Packaging of the Penforge desktop app (electron-builder 26).
# Windows: per-user NSIS installer (no admin). macOS: one dmg per arch (the JRE,
# PostgreSQL and sharp are native, a universal app would carry both copies).
# Unsigned by default; see scripts/notarize.cjs and the CI workflow for signing.
appId: app.penforge.desktop
productName: Penforge
copyright: Penforge contributors. Penpot is MPL-2.0 (Kaleidos).
directories:
  output: release
  buildResources: build-resources
files:
  - dist/**
  - renderer/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: build/runtime
    to: runtime
    filter:
      - "**/*"
asar: true
compression: maximum
afterSign: scripts/notarize.cjs

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Penforge-Setup-${version}.${ext}
  # Signing needs a certificate (CSC_LINK / CSC_KEY_PASSWORD); without it the
  # build is unsigned and SmartScreen warns on first start.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Penforge
  # keep %APPDATA%\Penforge (database, assets) unless the user removes it
  deleteAppDataOnUninstall: false
  include: build-resources/installer.nsh
  license: build-resources/license.txt

mac:
  target:
    - target: dmg
  category: public.app-category.graphics-design
  artifactName: Penforge-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  # notarization runs in scripts/notarize.cjs only when the Apple secrets are set
  notarize: false

dmg:
  title: Penforge ${version}

linux:
  target: [AppImage]
  category: Graphics
