name: Penforge desktop

# Builds the Penforge desktop installers: a per-user NSIS .exe for Windows and
# one .dmg per macOS arch. Unsigned unless the signing secrets exist.

on:
  workflow_dispatch:
    inputs:
      gh_ref:
        description: 'Branch or ref to build'
        type: string
        required: true
        default: 'develop'

concurrency:
  group: penforge-desktop-${{ inputs.gh_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. Backend uberjar + frontend bundle (JVM, devenv image) ──────────
  bundles:
    name: Backend and frontend bundles
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.gh_ref }}

      - name: Build the MCP plugin (served at /plugins/mcp)
        working-directory: mcp
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter mcp-common --filter mcp-plugin run build

      - name: Build backend and frontend bundles
        run: |
          ./manage.sh build-frontend-bundle
          ./manage.sh build-backend-bundle

      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: penpot-bundles
          path: |
            bundles/backend
            bundles/frontend
          retention-days: 3

  # ── 2. Desktop app per OS ─────────────────────────────────────────────
  desktop:
    name: Desktop ${{ matrix.target }}
    needs: bundles
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            os: windows-latest
            dist: dist:win
          - target: mac-arm64
            os: macos-14
            dist: dist:mac
          - target: mac-x64
            os: macos-13
            dist: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.gh_ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: penpot-bundles
          path: bundles

      - name: Install desktop dependencies
        working-directory: desktop
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Test the shell
        working-directory: desktop
        shell: bash
        run: |
          pnpm run typecheck
          pnpm test

      - name: Fetch JRE and PostgreSQL
        working-directory: desktop
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/fetch-runtime.mjs --target "$TARGET"

      - name: Stage the runtime
        working-directory: desktop
        shell: bash
        run: node scripts/stage.mjs --backend ../bundles/backend --frontend ../bundles/frontend

      - name: Build the installer
        working-directory: desktop
        shell: bash
        env:
          DIST: ${{ matrix.dist }}
          # Signing: set these secrets to sign (Windows) and notarize (macOS).
          CSC_LINK: ${{ secrets.PENFORGE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.PENFORGE_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.PENFORGE_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.PENFORGE_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.PENFORGE_APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run "$DIST" --publish never

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: ./scripts/smoke.ps1 -App release/win-unpacked/Penforge.exe

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        run: ./scripts/smoke.sh release/mac*/Penforge.app

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: penforge-desktop-${{ matrix.target }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
          retention-days: 14
